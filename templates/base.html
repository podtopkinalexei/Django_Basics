<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин смартфонов - {% block title %}{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        .footer {
            background-color: #f5f5f5;
            padding: 20px 0;
            margin-top: 40px;
        }

        .product-card {
            height: 100%;
            transition: transform 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .product-img {
            height: 200px;
            object-fit: contain;
            padding: 10px;
        }
        
        .list-group {
            --bs-list-group-active-bg: #95ccf8;            
        }
        
    </style>
</head>
<body>

{% include 'includes/navbar.html' %}

<!-- Основное содержимое -->
<main class="container my-4">
    {% block content %}
    {% endblock %}
</main>

<!-- Подвал -->
<footer class="footer">
    <div class="container text-center">
        <span class="text-muted">© 2025 Магазин смартфонов. Все права защищены.</span>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
