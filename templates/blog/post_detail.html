{% extends 'blog/base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<article class="blog-post">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    {% if post.preview %}
                    <img src="{{ post.preview.url }}" class="card-img-top img-fluid" alt="{{ post.title }}">
                    {% endif %}
                    <div class="card-body">
                        <h1 class="card-title display-5">{{ post.title }}</h1>
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <span class="text-muted">
                                <i class="bi bi-calendar"></i> {{ post.created_at|date:"d.m.Y H:i" }}
                            </span>
                            <span class="badge bg-primary rounded-pill">
                                <i class="bi bi-eye"></i> {{ post.views_count }}
                            </span>
                        </div>
                        
                        <div class="post-content mb-4">
                            {{ post.content|linebreaks }}
                        </div>
                        
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'blog:post_list' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i> Назад
                            </a>
                            <div>
                                <a href="{% url 'blog:post_update' post.pk %}" class="btn btn-primary-custom me-2">
                                    <i class="bi bi-pencil"></i> Редактировать
                                </a>
                                <a href="{% url 'blog:post_delete' post.pk %}" class="btn btn-danger">
                                    <i class="bi bi-trash"></i> Удалить
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</article>
{% endblock %}
